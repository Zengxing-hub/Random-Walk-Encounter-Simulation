<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>随机游走 · 两个人还能再相遇吗</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden}
  body{
    background:#080c18;color:#e8eefc;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  }
  #cv{display:block;position:fixed;inset:0;width:100%;height:100%}

  .panel{
    position:fixed;left:18px;top:18px;width:252px;
    padding:16px;border-radius:18px;
    background:rgba(16,23,42,.82);
    border:1px solid rgba(120,160,255,.16);
    backdrop-filter:blur(12px);
    box-shadow:0 16px 44px rgba(0,0,0,.5);
    user-select:none;
  }
  .title{font-size:14px;font-weight:600;letter-spacing:.6px;margin-bottom:5px}
  .sub{font-size:11.5px;color:#7f8db3;margin-bottom:14px;line-height:1.55}
  .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
  button{
    font:inherit;font-size:13px;color:#cdd8f5;cursor:pointer;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(140,170,255,.22);
    border-radius:10px;padding:9px 0;transition:.15s;
  }
  button:hover{background:rgba(120,160,255,.16);color:#fff}
  button:active{transform:scale(.97)}
  button.primary{
    grid-column:1/-1;
    background:linear-gradient(135deg,#3b82f6,#6366f1);
    border-color:transparent;color:#fff;font-weight:600;
  }
  button.primary:hover{filter:brightness(1.12)}
  button.on{background:rgba(120,160,255,.32);color:#fff;border-color:rgba(140,170,255,.55)}
  .kbd{font-size:10px;opacity:.75;border:1px solid rgba(255,255,255,.4);border-radius:4px;padding:0 4px;margin-left:5px}

  .stats{display:grid;gap:7px;font-size:12.5px}
  .row{display:flex;justify-content:space-between;align-items:center}
  .row span{color:#7f8db3}
  .row b{font-variant-numeric:tabular-nums;font-weight:600}

  .legend{display:flex;gap:16px;margin-top:12px;padding-top:12px;
          border-top:1px solid rgba(120,160,255,.12);font-size:12px;color:#9aa8c9}
  .legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}

  .toast{
    margin-top:12px;padding:8px 10px;border-radius:10px;font-size:12px;line-height:1.4;
    background:rgba(255,200,80,.12);border:1px solid rgba(255,200,80,.32);
    color:#ffd66e;opacity:0;transition:opacity .3s;
  }
  .toast.show{opacity:1}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div class="panel">
  <div class="title">两个随机游走的人</div>
  <div class="sub">每按一次，两人各自随机向上下左右走一步，轨迹会一直保留。</div>

  <div class="btns">
    <button id="stepBtn" class="primary">走一步<span class="kbd">空格</span></button>
    <button id="autoBtn">自动</button>
    <button id="resetBtn">重置</button>
  </div>

  <div class="stats">
    <div class="row"><span>步数</span><b id="sSteps">0</b></div>
    <div class="row"><span>直线距离</span><b id="sDist">0.0</b></div>
    <div class="row"><span>相遇次数</span><b id="sMeet">0</b></div>
    <div class="row"><span>最近一次相遇</span><b id="sLast">—</b></div>
  </div>

  <div class="legend">
    <div><i style="background:#4ea8ff"></i>甲</div>
    <div><i style="background:#ff7a59"></i>乙</div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
(function () {
  'use strict';

  /* ---------------- 基础引用 ---------------- */
  const cv       = document.getElementById('cv');
  const ctx      = cv.getContext('2d');
  const sSteps   = document.getElementById('sSteps');
  const sDist    = document.getElementById('sDist');
  const sMeet    = document.getElementById('sMeet');
  const sLast    = document.getElementById('sLast');
  const toastEl  = document.getElementById('toast');
  const stepBtn  = document.getElementById('stepBtn');
  const autoBtn  = document.getElementById('autoBtn');
  const resetBtn = document.getElementById('resetBtn');

  /* ---------------- 常量 & 状态 ---------------- */
  const DIRS = [[0, 1], [0, -1], [-1, 0], [1, 0]]; // 上 下 左 右
  const COLOR_A = '#4ea8ff'; // 甲
  const COLOR_B = '#ff7a59'; // 乙
  const AUTO_DELAY = 130;    // 自动模式每步间隔(ms)

  let DPR = 1, W = 0, H = 0;

  let A, B;                       // 两条轨迹（点数组）
  let steps, meetings, lastMeet;  // 统计
  let flash;                      // 相遇闪烁动画进度
  let bounds;                     // 包围盒，用于自动缩放

  let rafId = null;               // requestAnimationFrame id
  let auto = false;               // 自动模式
  let lastAutoTime = 0;
  let toastTimer = null;

  /* ---------------- 初始化 / 重置 ---------------- */
  function reset() {
    A = [{ x: 0, y: 0 }];
    B = [{ x: 0, y: 0 }];
    steps = 0;
    meetings = 0;
    lastMeet = null;
    flash = 0;
    bounds = { minX: 0, maxX: 0, minY: 0, maxY: 0 };
    updateUI();
    kick();
  }

  /* ---------------- 走一步（纯逻辑） ---------------- */
  function doStep() {
    const a = A[A.length - 1];
    const b = B[B.length - 1];
    const da = DIRS[(Math.random() * 4) | 0];
    const db = DIRS[(Math.random() * 4) | 0];

    const na = { x: a.x + da[0], y: a.y + da[1] };
    const nb = { x: b.x + db[0], y: b.y + db[1] };

    A.push(na);
    B.push(nb);
    growBounds(na);
    growBounds(nb);

    steps++;

    // 同一时刻站在同一个格子上 = 相遇
    if (na.x === nb.x && na.y === nb.y) {
      meetings++;
      lastMeet = steps;
      flash = 1;
      showToast('第 ' + steps + ' 步，他们又站到了同一个点上！');
    }

    updateUI();
  }

  function growBounds(p) {
    if (p.x < bounds.minX) bounds.minX = p.x;
    if (p.x > bounds.maxX) bounds.maxX = p.x;
    if (p.y < bounds.minY) bounds.minY = p.y;
    if (p.y > bounds.maxY) bounds.maxY = p.y;
  }

  /* ---------------- UI 数据 ---------------- */
  function updateUI() {
    const a = A[A.length - 1];
    const b = B[B.length - 1];
    sSteps.textContent = steps;
    sDist.textContent  = Math.hypot(a.x - b.x, a.y - b.y).toFixed(1);
    sMeet.textContent  = meetings;
    sLast.textContent  = lastMeet === null ? '—' : '第 ' + lastMeet + ' 步';
  }

  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 2200);
  }

  /* ---------------- 画布尺寸 ---------------- */
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    cv.width  = Math.round(W * DPR);
    cv.height = Math.round(H * DPR);
    cv.style.width  = W + 'px';
    cv.style.height = H + 'px';
    kick();
  }

  /* ---------------- 绘制 ---------------- */
  function draw() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, W, H);

    // 背景
    const bg = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.max(W, H) * 0.75);
    bg.addColorStop(0, '#111a33');
    bg.addColorStop(1, '#070b16');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    /* ---- 计算自适应坐标变换 ---- */
    const pad   = Math.min(W, H) * 0.10 + 40;
    const spanX = Math.max(bounds.maxX - bounds.minX, 1);
    const spanY = Math.max(bounds.maxY - bounds.minY, 1);

    let cell = Math.min((W - 2 * pad) / spanX, (H - 2 * pad) / spanY);
    cell = Math.max(2, Math.min(cell, 64));   // 限制缩放范围

    const midX = (bounds.minX + bounds.maxX) / 2;
    const midY = (bounds.minY + bounds.maxY) / 2;
    const ox = W / 2 - midX * cell;
    const oy = H / 2 + midY * cell;           // 屏幕 y 轴向下，所以取正

    const px = function (x) { return ox + x * cell; };
    const py = function (y) { return oy - y * cell; };

    /* ---- 网格 ---- */
    if (cell >= 16) {
      ctx.beginPath();
      for (let x = Math.floor(bounds.minX); x <= Math.ceil(bounds.maxX); x++) {
        const s = Math.round(px(x)) + 0.5;
        ctx.moveTo(s, 0); ctx.lineTo(s, H);
      }
      for (let y = Math.floor(bounds.minY); y <= Math.ceil(bounds.maxY); y++) {
        const s = Math.round(py(y)) + 0.5;
        ctx.moveTo(0, s); ctx.lineTo(W, s);
      }
      ctx.strokeStyle = 'rgba(120,160,255,0.06)';
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    /* ---- 起点 ---- */
    ctx.beginPath();
    ctx.arc(px(0), py(0), 5, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    /* ---- 轨迹 ---- */
    strokePath(A, COLOR_A, 0.55);
    strokePath(B, COLOR_B, 0.65);

    /* ---- 相遇脉冲 ---- */
    if (flash > 0) {
      const p = A[A.length - 1];
      const t = 1 - flash;
      ctx.beginPath();
      ctx.arc(px(p.x), py(p.y), 9 + t * 50, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(255,214,110,' + (flash * 0.9).toFixed(3) + ')';
      ctx.lineWidth = 3;
      ctx.stroke();
    }

    /* ---- 当前位置 ---- */
    const r = Math.max(5, Math.min(9, cell * 0.22));
    drawDot(A[A.length - 1], COLOR_A, r);
    drawDot(B[B.length - 1], COLOR_B, r);

    /* ---- 内部工具函数 ---- */
    function strokePath(path, color, alpha) {
      if (path.length < 2) return;
      ctx.beginPath();
      ctx.moveTo(px(path[0].x), py(path[0].y));
      for (let i = 1; i < path.length; i++) {
        ctx.lineTo(px(path[i].x), py(path[i].y));
      }
      ctx.globalAlpha = alpha;
      ctx.strokeStyle = color;
      ctx.lineWidth = 1.8;
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    function drawDot(p, color, rad) {
      const x = px(p.x), y = py(p.y);
      ctx.save();
      ctx.shadowColor = color;
      ctx.shadowBlur = 18;
      ctx.beginPath();
      ctx.arc(x, y, rad, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.fill();
      ctx.restore();

      ctx.beginPath();
      ctx.arc(x, y, rad * 0.42, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,0.95)';
      ctx.fill();
    }
  }

  /* ---------------- 动画循环 ---------------- */
  function kick() {
    if (rafId === null) rafId = requestAnimationFrame(loop);
  }

  function loop(t) {
    rafId = null;

    if (auto && t - lastAutoTime >= AUTO_DELAY) {
      lastAutoTime = t;
      doStep();
    }

    if (flash > 0) {
      flash *= 0.93;
      if (flash < 0.01) flash = 0;
    }

    draw();

    if (auto || flash > 0) rafId = requestAnimationFrame(loop);
  }

  /* ---------------- 交互 ---------------- */
  stepBtn.addEventListener('click', function () {
    doStep();
    kick();
  });

  autoBtn.addEventListener('click', function () {
    auto = !auto;
    autoBtn.classList.toggle('on', auto);
    autoBtn.textContent = auto ? '暂停' : '自动';
    lastAutoTime = 0;
    kick();
  });

  resetBtn.addEventListener('click', function () {
    auto = false;
    autoBtn.classList.remove('on');
    autoBtn.textContent = '自动';
    reset();
  });

  window.addEventListener('keydown', function (e) {
    if (e.code === 'Space') {
      e.preventDefault();
      doStep();
      kick();
    }
  });

  window.addEventListener('resize', resize);

  /* ---------------- 启动 ---------------- */
  resize();
  reset();
})();
</script>
</body>
</html>
