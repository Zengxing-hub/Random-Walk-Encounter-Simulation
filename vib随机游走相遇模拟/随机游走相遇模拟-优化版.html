<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>随机游走 · 两人何时再相遇</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden}
  body{
    background:#f6f4ef;color:#2b2a26;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  }
  #cv{display:block;position:fixed;inset:0;width:100%;height:100%}

  .panel{
    position:fixed;left:16px;top:16px;width:264px;
    padding:20px;border-radius:14px;
    background:rgba(255,253,248,.92);
    border:1px solid rgba(43,42,38,.10);
    backdrop-filter:blur(8px);
    box-shadow:0 8px 24px rgba(43,42,38,.08);
    user-select:none;
    animation:panel-in .4s ease-out both;
  }
  @keyframes panel-in{
    from{opacity:0;transform:translateY(6px)}
    to{opacity:1;transform:translateY(0)}
  }
  .title{font-size:13px;font-weight:600;margin-bottom:6px}
  .sub{font-size:12px;color:#6f6d64;margin-bottom:16px;line-height:1.6}

  .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
  button{
    font:inherit;font-size:13px;color:#2b2a26;cursor:pointer;
    background:#fbfaf6;
    border:1px solid rgba(43,42,38,.14);
    border-radius:8px;padding:9px 0;
    transition:background-color .15s ease,border-color .15s ease,color .15s ease;
  }
  button:hover{background:#f1efe8;border-color:rgba(43,42,38,.22)}
  button:active{transform:scale(.98)}
  button:focus-visible{outline:2px solid #2b2a26;outline-offset:2px}
  button.primary{
    grid-column:1/-1;
    background:#2b2a26;border-color:#2b2a26;color:#f6f4ef;font-weight:500;
  }
  button.primary:hover{background:#3a3831;border-color:#3a3831}
  button.on{background:#ecebe4;border-color:rgba(43,42,38,.28);font-weight:500}
  .kbd{
    font-family:ui-monospace,"SF Mono",Consolas,monospace;
    font-size:10px;color:inherit;opacity:.65;
    border:1px solid rgba(246,244,239,.4);border-radius:4px;
    padding:1px 5px;margin-left:6px;vertical-align:1px;
  }

  .stats{display:grid;gap:8px;font-size:12.5px}
  .row{display:flex;justify-content:space-between;align-items:baseline}
  .row span{color:#6f6d64}
  .row b{
    font-family:ui-monospace,"SF Mono",Consolas,monospace;
    font-variant-numeric:tabular-nums;font-weight:500;
  }

  .legend{display:flex;gap:16px;margin-top:14px;padding-top:14px;
          border-top:1px solid rgba(43,42,38,.08);font-size:12px;color:#6f6d64}
  .legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:0}
  .legend .ring{background:transparent;border:1.5px solid rgba(43,42,38,.55);width:7px;height:7px}

  .toast{
    margin-top:14px;padding:9px 12px;border-radius:8px;font-size:12px;line-height:1.5;
    background:#faf5e6;border:1px solid rgba(154,115,37,.30);
    color:#8a6820;opacity:0;transition:opacity .3s ease;
  }
  .toast.show{opacity:1}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div class="panel">
  <div class="title">两个随机游走的人</div>
  <div class="sub">每按一次，两人各自向上、下、左、右随机走一步，轨迹会一直保留。</div>

  <div class="btns">
    <button id="stepBtn" class="primary">走一步<span class="kbd">空格</span></button>
    <button id="autoBtn">自动</button>
    <button id="resetBtn">重置</button>
  </div>

  <div class="stats">
    <div class="row"><span>步数</span><b id="sSteps">0</b></div>
    <div class="row"><span>直线距离</span><b id="sDist">0.0</b></div>
    <div class="row"><span>相遇次数</span><b id="sMeet">0</b></div>
    <div class="row"><span>最近一次相遇</span><b id="sLast">—</b></div>
  </div>

  <div class="legend">
    <div><i style="background:#1d6fb8"></i>甲</div>
    <div><i style="background:#c8442c"></i>乙</div>
    <div><i class="ring"></i>相遇点</div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
(function () {
  'use strict';

  /* ---------------- 基础引用 ---------------- */
  const cv       = document.getElementById('cv');
  const ctx      = cv.getContext('2d');
  const sSteps   = document.getElementById('sSteps');
  const sDist    = document.getElementById('sDist');
  const sMeet    = document.getElementById('sMeet');
  const sLast    = document.getElementById('sLast');
  const toastEl  = document.getElementById('toast');
  const stepBtn  = document.getElementById('stepBtn');
  const autoBtn  = document.getElementById('autoBtn');
  const resetBtn = document.getElementById('resetBtn');

  /* ---------------- 常量 & 状态 ---------------- */
  const DIRS = [[0, 1], [0, -1], [-1, 0], [1, 0]]; // 上 下 左 右
  const COLOR_A = '#1d6fb8';   // 甲：钢笔蓝
  const COLOR_B = '#c8442c';   // 乙：朱砂红
  const INK     = '43,42,38';  // 墨色 rgb
  const AUTO_DELAY = 130;      // 自动模式每步间隔(ms)
  const FRESH_INK  = 24;       // 最近 N 段按"湿墨"全浓度绘制

  let DPR = 1, W = 0, H = 0;

  let A, B;                       // 两条轨迹（点数组）
  let meetPoints;                 // 每次相遇的永久标记
  let steps, meetings, lastMeet;  // 统计
  let flash;                      // 相遇脉冲动画进度
  let bounds;                     // 包围盒，用于自动缩放

  let rafId = null;               // requestAnimationFrame id
  let auto = false;               // 自动模式
  let lastAutoTime = 0;
  let toastTimer = null;

  /* ---------------- 初始化 / 重置 ---------------- */
  function reset() {
    A = [{ x: 0, y: 0 }];
    B = [{ x: 0, y: 0 }];
    meetPoints = [];
    steps = 0;
    meetings = 0;
    lastMeet = null;
    flash = 0;
    bounds = { minX: 0, maxX: 0, minY: 0, maxY: 0 };
    updateUI();
    kick();
  }

  /* ---------------- 走一步（纯逻辑） ---------------- */
  function doStep() {
    const a = A[A.length - 1];
    const b = B[B.length - 1];
    const da = DIRS[(Math.random() * 4) | 0];
    const db = DIRS[(Math.random() * 4) | 0];

    const na = { x: a.x + da[0], y: a.y + da[1] };
    const nb = { x: b.x + db[0], y: b.y + db[1] };

    A.push(na);
    B.push(nb);
    growBounds(na);
    growBounds(nb);

    steps++;

    // 同一时刻站在同一个格子上 = 相遇
    if (na.x === nb.x && na.y === nb.y) {
      meetings++;
      lastMeet = steps;
      meetPoints.push({ x: na.x, y: na.y });
      flash = 1;
      showToast('第 ' + steps + ' 步，两人走到了同一个点');
    }

    updateUI();
  }

  function growBounds(p) {
    if (p.x < bounds.minX) bounds.minX = p.x;
    if (p.x > bounds.maxX) bounds.maxX = p.x;
    if (p.y < bounds.minY) bounds.minY = p.y;
    if (p.y > bounds.maxY) bounds.maxY = p.y;
  }

  /* ---------------- UI 数据 ---------------- */
  function updateUI() {
    const a = A[A.length - 1];
    const b = B[B.length - 1];
    sSteps.textContent = steps;
    sDist.textContent  = Math.hypot(a.x - b.x, a.y - b.y).toFixed(1);
    sMeet.textContent  = meetings;
    sLast.textContent  = lastMeet === null ? '—' : '第 ' + lastMeet + ' 步';
  }

  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 2200);
  }

  /* ---------------- 画布尺寸 ---------------- */
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    cv.width  = Math.round(W * DPR);
    cv.height = Math.round(H * DPR);
    cv.style.width  = W + 'px';
    cv.style.height = H + 'px';
    kick();
  }

  /* ---------------- 绘制 ---------------- */
  function draw() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = '#f6f4ef';
    ctx.fillRect(0, 0, W, H);

    /* ---- 计算自适应坐标变换 ---- */
    const pad   = Math.min(W, H) * 0.10 + 40;
    const spanX = Math.max(bounds.maxX - bounds.minX, 1);
    const spanY = Math.max(bounds.maxY - bounds.minY, 1);

    let cell = Math.min((W - 2 * pad) / spanX, (H - 2 * pad) / spanY);
    cell = Math.max(2, Math.min(cell, 64));   // 限制缩放范围

    const midX = (bounds.minX + bounds.maxX) / 2;
    const midY = (bounds.minY + bounds.maxY) / 2;
    const ox = W / 2 - midX * cell;
    const oy = H / 2 + midY * cell;           // 屏幕 y 轴向下，所以取正

    const px = function (x) { return ox + x * cell; };
    const py = function (y) { return oy - y * cell; };

    /* ---- 方格纸网格 ---- */
    if (cell >= 14) {
      ctx.beginPath();
      for (let x = Math.floor(bounds.minX); x <= Math.ceil(bounds.maxX); x++) {
        const s = Math.round(px(x)) + 0.5;
        ctx.moveTo(s, 0); ctx.lineTo(s, H);
      }
      for (let y = Math.floor(bounds.minY); y <= Math.ceil(bounds.maxY); y++) {
        const s = Math.round(py(y)) + 0.5;
        ctx.moveTo(0, s); ctx.lineTo(W, s);
      }
      ctx.strokeStyle = 'rgba(29,111,184,0.10)';
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    /* ---- 原点十字 ---- */
    ctx.beginPath();
    ctx.moveTo(px(0) - 5.5, py(0)); ctx.lineTo(px(0) + 5.5, py(0));
    ctx.moveTo(px(0), py(0) - 5.5); ctx.lineTo(px(0), py(0) + 5.5);
    ctx.strokeStyle = 'rgba(' + INK + ',0.40)';
    ctx.lineWidth = 1.2;
    ctx.stroke();

    /* ---- 相遇点的永久标记（地图图钉） ---- */
    for (let i = 0; i < meetPoints.length; i++) {
      const mx = px(meetPoints[i].x), my = py(meetPoints[i].y);
      ctx.beginPath();
      ctx.arc(mx, my, 5, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(' + INK + ',0.55)';
      ctx.lineWidth = 1.2;
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(mx, my, 1.4, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(' + INK + ',0.55)';
      ctx.fill();
    }

    /* ---- 轨迹：旧墨淡、新墨浓 ---- */
    strokePath(A, COLOR_A);
    strokePath(B, COLOR_B);

    /* ---- 相遇脉冲 ---- */
    if (flash > 0) {
      const p = A[A.length - 1];
      const t = 1 - flash;
      ctx.beginPath();
      ctx.arc(px(p.x), py(p.y), 8 + t * 44, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(200,68,44,' + (flash * 0.7).toFixed(3) + ')';
      ctx.lineWidth = 2.5;
      ctx.stroke();
    }

    /* ---- 当前位置 ---- */
    const r = Math.max(4, Math.min(8, cell * 0.20));
    drawDot(A[A.length - 1], COLOR_A, r);
    drawDot(B[B.length - 1], COLOR_B, r);

    /* ---- 内部工具函数 ---- */
    function strokePath(path, color) {
      if (path.length < 2) return;
      // 旧轨迹：淡墨
      ctx.beginPath();
      ctx.moveTo(px(path[0].x), py(path[0].y));
      const oldEnd = Math.max(1, path.length - FRESH_INK);
      for (let i = 1; i < oldEnd; i++) {
        ctx.lineTo(px(path[i].x), py(path[i].y));
      }
      ctx.globalAlpha = 0.30;
      ctx.strokeStyle = color;
      ctx.lineWidth = 1.6;
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
      ctx.stroke();
      // 新轨迹：湿墨
      if (path.length > 2 && oldEnd < path.length) {
        ctx.beginPath();
        ctx.moveTo(px(path[oldEnd - 1].x), py(path[oldEnd - 1].y));
        for (let i = oldEnd; i < path.length; i++) {
          ctx.lineTo(px(path[i].x), py(path[i].y));
        }
        ctx.globalAlpha = 0.95;
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }

    function drawDot(p, color, rad) {
      const x = px(p.x), y = py(p.y);
      ctx.beginPath();
      ctx.arc(x, y, rad, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.fill();
      ctx.beginPath();
      ctx.arc(x, y, rad * 0.38, 0, Math.PI * 2);
      ctx.fillStyle = '#f6f4ef';
      ctx.fill();
    }
  }

  /* ---------------- 动画循环 ---------------- */
  function kick() {
    if (rafId === null) rafId = requestAnimationFrame(loop);
  }

  function loop(t) {
    rafId = null;

    if (auto && t - lastAutoTime >= AUTO_DELAY) {
      lastAutoTime = t;
      doStep();
    }

    if (flash > 0) {
      flash *= 0.93;
      if (flash < 0.01) flash = 0;
    }

    draw();

    if (auto || flash > 0) rafId = requestAnimationFrame(loop);
  }

  /* ---------------- 交互 ---------------- */
  stepBtn.addEventListener('click', function () {
    doStep();
    kick();
  });

  autoBtn.addEventListener('click', function () {
    auto = !auto;
    autoBtn.classList.toggle('on', auto);
    autoBtn.textContent = auto ? '暂停' : '自动';
    lastAutoTime = 0;
    kick();
  });

  resetBtn.addEventListener('click', function () {
    auto = false;
    autoBtn.classList.remove('on');
    autoBtn.textContent = '自动';
    reset();
  });

  window.addEventListener('keydown', function (e) {
    if (e.code === 'Space') {
      e.preventDefault();
      doStep();
      kick();
    }
  });

  window.addEventListener('resize', resize);

  /* ---------------- 启动 ---------------- */
  resize();
  reset();
})();
</script>
</body>
</html>
